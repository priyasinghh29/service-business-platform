services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oknitech-laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: app_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    depends_on:
      - mysql
      - redis
    networks:
      - oknitech

  nginx:
    image: nginx:alpine
    container_name: oknitech-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - oknitech

  mysql:
    image: mysql:8.0
    container_name: oknitech-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oknitech

  redis:
    image: redis:alpine
    container_name: oknitech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oknitech

networks:
  oknitech:

volumes:
  mysql_data:
  redis_data: